name: Live Sync Resultados

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de execução'
        required: true
        default: 'live_auto'
        type: choice
        options:
          - live_auto
          - check_only
          - sync_once

permissions:
  contents: write
  actions: write

concurrency:
  group: live-results-sync
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar janela temporal (com suporte a fusos horários)
        id: check_active
        run: |
          STATUS=$(node -e '
            const fs = require("fs");
            const lt = JSON.parse(fs.readFileSync("scripts/live-targets.json", "utf8"));
            const now = Date.now();
            let anyRunning = false;
            let anyPending = false;

            for (const t of (lt.targets || [])) {
              const cfg = JSON.parse(fs.readFileSync(t.configFile, "utf8"));
              const ev = (cfg.eventos || []).find(e => e.id === t.eventoId) || (cfg.eventos && cfg.eventos[0]);
              if (!ev) continue;
              const iniTs = Date.parse((ev.inicio || "2000-01-01") + "T00:00:00" + (ev.tz || "+14:00"));
              const fimTs = Date.parse((ev.fim || "2099-12-31") + "T23:59:59" + (ev.tz || "-12:00"));
              if (now >= iniTs && now <= fimTs) anyRunning = true;
              if (now <= fimTs) anyPending = true;
            }
            console.log(anyRunning ? "running" : (anyPending ? "waiting" : "ended"));
          ')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Estado do evento: $STATUS"

      - name: Executar scraper multi-sistema (ciclo 10s)
        if: steps.check_active.outputs.status != 'ended' || github.event.inputs.modo != 'live_auto'
        env:
          MODO: ${{ github.event.inputs.modo || 'live_auto' }}
        run: |
          RESULT_FILES=$(node -e 'const lt = require("./scripts/live-targets.json"); console.log(lt.targets.map(t => t.resultsFile).join(" "));')

          if [ "$MODO" = "check_only" ]; then
            node scripts/sync-live.js --check
          elif [ "$MODO" = "sync_once" ]; then
            node scripts/sync-live.js
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            node scripts/sync-live.js --live
          fi

      - name: Guardar ficheiros (modos manuais check_only / sync_once)
        if: github.event.inputs.modo == 'check_only' || github.event.inputs.modo == 'sync_once'
        run: |
          RESULT_FILES=$(node -e 'const lt = require("./scripts/live-targets.json"); console.log(lt.targets.map(t => t.resultsFile).join(" "));')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $RESULT_FILES scripts/scrape-report.log
          if ! git diff --staged --quiet; then
            git commit -m "Atualizar resultados/log [skip ci]"
            git push
          fi

      - name: Encadear próximo turno (enquanto agora <= fim)
        if: ${{ !cancelled() && (github.event.inputs.modo == 'live_auto' || github.event.inputs.modo == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STILL_PENDING=$(node -e '
            const fs = require("fs");
            const lt = JSON.parse(fs.readFileSync("scripts/live-targets.json", "utf8"));
            const now = Date.now();
            const anyPending = (lt.targets || []).some(t => {
              const cfg = JSON.parse(fs.readFileSync(t.configFile, "utf8"));
              const ev = (cfg.eventos || []).find(e => e.id === t.eventoId) || (cfg.eventos && cfg.eventos[0]);
              if (!ev) return false;
              const fimTs = Date.parse((ev.fim || "2099-12-31") + "T23:59:59" + (ev.tz || "-12:00"));
              return now <= fimTs;
            });
            console.log(anyPending ? "true" : "false");
          ')
          if [ "$STILL_PENDING" = "true" ]; then
            gh workflow run live-sync.yml --repo "$GITHUB_REPOSITORY" --ref main -f modo=live_auto || true
          else
            echo "Todos os eventos terminaram. Não será iniciado novo turno."
          fi
