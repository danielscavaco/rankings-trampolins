name: Teste CMGI Live
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-cmgi-live.js
        env:
          CMGI_URL: https://sporttech.io/events/01a1be6a-b476-781a-a380-de9079956fde/ovs/
