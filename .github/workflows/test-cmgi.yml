name: CMGI Live Sync

on:
  workflow_dispatch:
    inputs:
      teste:
        description: 'Fazer apenas uma leitura única agora (sem loop contínuo)'
        type: boolean
        default: false
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: cmgi-live-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar Sporttech em tempo real
        env:
          CMGI_URL: ${{ secrets.CMGI_URL }}
          SINGLE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.teste && 'true' || 'false' }}
          POLL_MS: '10000'
          MIN_COMMIT_MS: '15000'
          BUDGET_MS: '18000000'
        run: node scripts/cmgi-sync.js

      - name: Encadear execução seguinte
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.teste) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cmgi-sync.yml --repo "$GITHUB_REPOSITORY" --ref main -f teste=false || true
