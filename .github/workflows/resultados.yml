name: Resultados Competição

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      event_id:
        description: 'ID do evento em config.json para leitura imediata (ex: cottbus, nanjing)'
        required: false
        default: ''
      modo_teste:
        description: 'Gravar em data/test-live.json em vez de data/results.json'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: resultados-sync
  cancel-in-progress: false

jobs:
  resultados:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar resultados segundo config.json
        run: |
          EVENT_ID="${{ github.event.inputs.event_id }}"
          TESTE="${{ github.event.inputs.modo_teste == true && 'true' || 'false' }}"

          OUT_FILE="data/results.json"
          if [ "$TESTE" = "true" ]; then
            OUT_FILE="data/test-live.json"
          fi

          if [ -n "$EVENT_ID" ]; then
            python3 scripts/sync_runner.py \
              --event-id "$EVENT_ID" \
              --out "$OUT_FILE" \
              --git-push
          else
            python3 scripts/sync_runner.py \
              --out "$OUT_FILE" \
              --poll 30 \
              --budget 19800 \
              --git-push
          fi
