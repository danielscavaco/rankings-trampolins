name: Live Sync Sporttech

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de execução'
        required: true
        default: 'live_auto'
        type: choice
        options:
          - live_auto
          - check_only
          - sync_once

permissions:
  contents: write
  actions: write

concurrency:
  group: live-sporttech-sync
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar se algum evento alvo ainda está ativo (via live-targets.json)
        id: check_active
        run: |
          ACTIVE=$(node -e '
            const fs = require("fs");
            const lt = JSON.parse(fs.readFileSync("scripts/live-targets.json", "utf8"));
            const anyActive = (lt.targets || []).some(t => {
              const cfg = JSON.parse(fs.readFileSync(t.configFile, "utf8"));
              const res = fs.existsSync(t.resultsFile) ? JSON.parse(fs.readFileSync(t.resultsFile, "utf8")) : { live: true };
              const fimStr = (cfg.eventos && cfg.eventos[0] && cfg.eventos[0].fim) || "2099-12-31";
              const fimTs = Date.parse(fimStr + "T23:59:59Z");
              return Date.now() <= fimTs && res.live !== false;
            });
            console.log(anyActive ? "true" : "false");
          ')
          echo "active=$ACTIVE" >> $GITHUB_OUTPUT
          echo "Algum evento alvo ativo: $ACTIVE"

      - name: Executar scraper Sporttech (ciclo 10s)
        if: steps.check_active.outputs.active == 'true' || github.event.inputs.modo != 'live_auto'
        env:
          MODO: ${{ github.event.inputs.modo || 'live_auto' }}
        run: |
          RESULT_FILES=$(node -e 'const lt = require("./scripts/live-targets.json"); console.log(lt.targets.map(t => t.resultsFile).join(" "));')

          if [ "$MODO" = "check_only" ]; then
            node scripts/scrape-sporttech.js --check
          elif [ "$MODO" = "sync_once" ]; then
            node scripts/scrape-sporttech.js
          else
            START_TS=$(date +%s)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            while true; do
              NOW_TS=$(date +%s)

              # Turno máximo de 3h30m (12600s) antes de encadear o seguinte
              if [ $((NOW_TS - START_TS)) -ge 12600 ]; then
                echo "Turno de 3h30m concluído. A encadear próximo turno..."
                break
              fi

              STILL_ACTIVE=$(node -e '
                const fs = require("fs");
                const lt = JSON.parse(fs.readFileSync("scripts/live-targets.json", "utf8"));
                const anyActive = (lt.targets || []).some(t => {
                  const cfg = JSON.parse(fs.readFileSync(t.configFile, "utf8"));
                  const res = fs.existsSync(t.resultsFile) ? JSON.parse(fs.readFileSync(t.resultsFile, "utf8")) : { live: true };
                  const fimStr = (cfg.eventos && cfg.eventos[0] && cfg.eventos[0].fim) || "2099-12-31";
                  const fimTs = Date.parse(fimStr + "T23:59:59Z");
                  return Date.now() <= fimTs && res.live !== false;
                });
                console.log(anyActive ? "true" : "false");
              ')

              if [ "$STILL_ACTIVE" != "true" ]; then
                echo "Data de fim ultrapassada nos JSONs ou live=false. A encerrar."
                break
              fi

              node scripts/scrape-sporttech.js

              git add $RESULT_FILES scripts/scrape-report.log
              if ! git diff --staged --quiet; then
                git commit -m "Live update Sporttech [skip ci]"
                git push || (git pull --rebase -X theirs && git push)
              fi

              sleep 10
            done
          fi

      - name: Guardar ficheiros (modos manuais check_only / sync_once)
        if: github.event.inputs.modo == 'check_only' || github.event.inputs.modo == 'sync_once'
        run: |
          RESULT_FILES=$(node -e 'const lt = require("./scripts/live-targets.json"); console.log(lt.targets.map(t => t.resultsFile).join(" "));')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $RESULT_FILES scripts/scrape-report.log
          if ! git diff --staged --quiet; then
            git commit -m "Atualizar resultados/log Sporttech [skip ci]"
            git push
          fi

      - name: Encadear próximo turno (apenas se algum evento ainda não acabou)
        if: ${{ !cancelled() && (github.event.inputs.modo == 'live_auto' || github.event.inputs.modo == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STILL_ACTIVE=$(node -e '
            const fs = require("fs");
            const lt = JSON.parse(fs.readFileSync("scripts/live-targets.json", "utf8"));
            const anyActive = (lt.targets || []).some(t => {
              const cfg = JSON.parse(fs.readFileSync(t.configFile, "utf8"));
              const res = fs.existsSync(t.resultsFile) ? JSON.parse(fs.readFileSync(t.resultsFile, "utf8")) : { live: true };
              const fimStr = (cfg.eventos && cfg.eventos[0] && cfg.eventos[0].fim) || "2099-12-31";
              const fimTs = Date.parse(fimStr + "T23:59:59Z");
              return Date.now() <= fimTs && res.live !== false;
            });
            console.log(anyActive ? "true" : "false");
          ')
          if [ "$STILL_ACTIVE" = "true" ]; then
            gh workflow run live-sporttech.yml --repo "$GITHUB_REPOSITORY" --ref main -f modo=live_auto || true
          else
            echo "Eventos concluídos. Não será iniciado novo turno."
          fi
