<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rankings Trampolins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #F6F3F3;
      --surface: #FFFFFF;
      --surface-2: #EFE8E8;
      --ink: #221415;
      --muted: #6B5759;
      --line: #E2D5D6;
      --accent: #8B1A22;
      --accent-soft: #F7DFE1;
      --on-accent: #FFFFFF;
      --good: #146B3A;
      --good-soft: #DCF0E4;
      --blue: #15589C;
      --blue-soft: #DCEBFA;
      --warn: #946300;
      --warn-soft: #FBEEC8;
      --bad: #9E1C24;
      --sim: #B58100;
      --sim-soft: #FDF3D1;
      --f-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
      --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #170F10;
        --surface: #221618;
        --surface-2: #2D1D20;
        --ink: #F2E9EA;
        --muted: #AC9698;
        --line: #3E2A2D;
        --accent: #E26B74;
        --accent-soft: #461B20;
        --on-accent: #24090B;
        --good: #5ED08C;
        --good-soft: #173A27;
        --blue: #6DB3F8;
        --blue-soft: #162E47;
        --warn: #F0C24B;
        --warn-soft: #3D2E0D;
        --bad: #F38B80;
        --sim: #F5C842;
        --sim-soft: #3B2E0B;
        color-scheme: dark;
      }
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 var(--f-body);
      padding-block: 20px 64px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    [hidden] { display: none !important; }
    #trackerBox:empty,
    #legendBox:empty { display: none; }

    h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
    button, select, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .tn { font-variant-numeric: tabular-nums; }

    /* Layout com Menu Lateral Esquerdo */
    .shell {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sb-brand {
      font-size: 11.5px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .sb-nav { display: flex; flex-direction: column; gap: 4px; }
    .sb-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      transition: background .12s, color .12s;
    }
    .sb-btn:hover { background: var(--surface-2); color: var(--ink); }
    .sb-btn[aria-current="page"] {
      background: var(--accent);
      color: var(--on-accent);
      box-shadow: 0 1px 3px rgb(0 0 0 / .16);
    }
    .sb-btn b { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
    .sb-btn small { font-size: 11px; opacity: 0.82; }

    .main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

    header { display: flex; flex-direction: column; gap: 6px; }
    .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
    h1 { font-size: clamp(32px, 5vw, 44px); line-height: 1; }
    .sub { color: var(--muted); max-width: 68ch; margin: 0; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
    .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
    .seg button { border: 0; background: transparent; padding: 8px 15px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; min-height: 38px; }
    .seg button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); box-shadow: 0 1px 2px rgb(0 0 0 / .16); }
    .seg .full { display: none; }
    @media (min-width: 560px) { .seg .full { display: inline; } .seg .short { display: none; } }

    .club-filter { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
    .club-group-head {
      padding: 10px 14px;
      background: var(--surface-2);
      border-top: 1px solid var(--line);
      font-family: var(--f-display);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .club-group-head:first-child { border-top: 0; }
    .club-group-head small { font-family: var(--f-body); font-size: 11.5px; font-weight: 400; color: var(--muted); }

    .facts { display: flex; flex-wrap: wrap; gap: 8px 10px; }
    .fact { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; display: flex; gap: 8px; align-items: baseline; }
    .fact span { font-size: 12px; color: var(--muted); }
    .fact b { font-family: var(--f-display); font-size: 20px; font-weight: 600; line-height: 1; }
    .fact.blue b { color: var(--blue); }
    .fact.good b { color: var(--good); }
    .fact.warn b { color: var(--warn); }

    /* Tracker de vagas reservadas (Continentes + Anfitrião) */
    .quota-tracker {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .qt-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
    .qt-head b { color: var(--ink); font-weight: 600; }
    .qt-pills { display: flex; flex-wrap: wrap; gap: 6px 8px; }
    .qt-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--warn-soft);
      color: var(--warn);
      border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
    }
    .qt-pill.done {
      background: var(--surface-2);
      color: var(--muted);
      border-color: var(--line);
      text-decoration: line-through;
      opacity: 0.78;
    }
    .qt-pill.done .qt-noc { text-decoration: none; display: inline-block; font-weight: 600; color: var(--good); margin-left: 2px; }

    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--muted); align-items: center; }
    .leg-item { display: inline-flex; align-items: center; gap: 6px; }
    .leg-swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
    .leg-swatch.blue { background: var(--blue-soft); border: 1px solid var(--blue); }
    .leg-swatch.good { background: var(--good-soft); border: 1px solid var(--good); }
    .leg-swatch.warn { background: var(--warn-soft); border: 1px solid var(--warn); }

    /* Lista de seriação */
    .board { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .board ol { list-style: none; margin: 0; padding: 0; }
    .head, .rowgrid { display: grid; grid-template-columns: 38px minmax(165px, 1.35fr) minmax(0, 4.2fr) 84px 155px; gap: 0 10px; align-items: center; padding: 10px 14px; }
    .head { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); align-items: end; }
    .cells { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 4px; }
    .hcell { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1px; text-transform: none; letter-spacing: 0; min-width: 0; }
    .hcell b { font-weight: 600; color: var(--ink); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .hcell i { font-style: normal; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--muted); }
    .dot.done { background: var(--good); }
    .dot.live { background: var(--accent); }

    .row { border-top: 1px solid var(--line); }
    .row.st-crit1 { background: color-mix(in srgb, var(--blue-soft) 34%, var(--surface)); }
    .row.st-safe  { background: color-mix(in srgb, var(--good-soft) 28%, var(--surface)); }
    .row.st-bubble { background: color-mix(in srgb, var(--warn-soft) 35%, var(--surface)); }
    .row.st-por   { box-shadow: inset 3px 0 0 var(--accent); }

    .rowgrid { width: 100%; min-height: 58px; }
    .rk { font-family: var(--f-display); font-size: 26px; font-weight: 600; line-height: 1; color: var(--ink); }
    .rk.crit1 { color: var(--blue); }
    .rk.nocfull, .row.out .rk { color: var(--muted); font-size: 22px; }

    .who { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
    .who b { font-weight: 600; overflow-wrap: anywhere; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .who small { color: var(--muted); font-size: 12px; }
    .noc-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .04em;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--surface-2);
      color: var(--muted);
    }
    .noc-tag.por { background: var(--accent-soft); color: var(--accent); }
    .noc-flag { width: 14px; height: 10px; object-fit: cover; border-radius: 1.5px; box-shadow: 0 0 0 1px rgb(0 0 0 / .12); }

    .cell {
      padding: 5px 4px;
      border-radius: 6px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      min-height: 30px;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 0;
      background: transparent;
      text-align: center;
      font-size: 12.5px;
      white-space: nowrap;
    }
    button.cell { cursor: pointer; transition: transform .08s, box-shadow .12s; }
    button.cell:hover { filter: brightness(0.96); }
    button.cell[aria-expanded="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
    .cell::before { content: attr(data-l); display: none; font-size: 11px; margin-right: 4px; color: var(--muted); }
    .cell.cont { background: var(--good-soft); color: var(--good); font-weight: 600; }
    .cell.ok { box-shadow: inset 0 0 0 1px var(--muted); color: var(--ink); }
    .cell.nc .val { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
    .cell.sim { background: var(--sim-soft); box-shadow: inset 0 0 0 1.5px var(--sim); }
    .cell.faded { opacity: 0.42; }
    .cell .subrk { font-size: 10.5px; opacity: 0.78; font-weight: 400; }

    .tot { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .tot b { font-family: var(--f-display); font-size: 25px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
    .tot.faded { opacity: 0.42; }
    .tot small { font-size: 11px; color: var(--muted); }

    .st { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    .chip.crit1 { background: var(--blue-soft); color: var(--blue); }
    .chip.vaga { background: var(--good-soft); color: var(--good); }
    .chip.bubble { background: var(--warn-soft); color: var(--warn); }
    .chip.min { background: var(--accent-soft); color: var(--accent); }
    .chip.simc { background: var(--sim-soft); color: var(--sim); }
    .chip.tie { background: var(--warn-soft); color: var(--warn); white-space: normal; line-height: 1.25; border-radius: 6px; padding: 3px 8px; }

    .cut { padding: 6px 16px; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--good); background: var(--good-soft); border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
    .cut.bubble { color: var(--warn); background: var(--warn-soft); }
    .gap { font-size: 12px; color: var(--muted); }

    /* Gaveta de detalhe técnico por prova */
    .detail { padding: 12px 16px 16px 72px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); border-top: 1px dashed var(--line); }
    .detail-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .detail-head h3 { font-size: 17px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); }
    .detail-close { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
    .detail-close:hover { color: var(--ink); }

    .rut-table { width: 100%; max-width: 640px; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .rut-table th, .rut-table td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13px; }
    .rut-table th:first-child, .rut-table td:first-child { text-align: left; font-weight: 600; }
    .rut-table th { background: color-mix(in srgb, var(--surface-2) 60%, var(--surface)); color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
    .rut-table tr:last-child td { border-bottom: 0; }
    .rut-table tr.used td:first-child { color: var(--good); }
    .rut-badge { display: inline-block; font-size: 10px; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: var(--good-soft); color: var(--good); margin-left: 6px; vertical-align: middle; }

    .detail-notes { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; }
    .detail-notes li.ok b { color: var(--good); }
    .detail-notes li.no b { color: var(--bad); }
    .detail-notes li.pend b { color: var(--warn); }

    /* Painéis e simulador */
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .pbody { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
    .simbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 38px; max-width: 100%; }
    .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; min-height: 38px; font-weight: 500; }
    .btn:hover { background: var(--surface-2); }
    .simrows { display: flex; flex-direction: column; gap: 10px; }
    .simrow { display: grid; grid-template-columns: 160px 1fr; gap: 6px 14px; align-items: start; padding-top: 10px; border-top: 1px solid var(--line); }
    .simrow .en { font-weight: 600; }
    .simrow .en small { display: block; font-weight: 400; color: var(--muted); }
    .fields { display: flex; flex-wrap: wrap; gap: 8px 12px; }
    .fld { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
    .fld input { width: 88px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-variant-numeric: tabular-nums; }
    .fld input.mod { background: var(--sim-soft); border-color: var(--sim); box-shadow: inset 0 0 0 1px var(--sim); }
    .hint { font-size: 12.5px; color: var(--muted); }
    .res { font-size: 13px; margin-top: 4px; }

    /* Rodapé */
    footer {
      margin-top: 8px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
    }
    footer b { color: var(--ink); font-weight: 500; }

    /* Indicador não-clicável de atualização em direto */
    .live-pill {
      position: fixed;
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: max(16px, env(safe-area-inset-bottom, 0px));
      z-index: 50;
      pointer-events: none;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid color-mix(in srgb, var(--good) 45%, var(--line));
      box-shadow: 0 4px 14px rgb(0 0 0 / .14);
      font-size: 12.5px;
      font-weight: 500;
    }
    .live-pulse {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 65%, transparent);
      animation: pulseLive 1.8s infinite;
    }
    @keyframes pulseLive {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 65%, transparent); }
      70% { box-shadow: 0 0 0 7px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; gap: 16px; }
      .sidebar { position: static; flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; }
      .sb-brand { border-bottom: 0; padding-bottom: 0; }
      .sb-nav { flex-direction: row; flex-wrap: wrap; }
      .sb-btn { width: auto; padding: 7px 12px; }
      .sb-btn small { display: none; }
    }

    @media (max-width: 840px) {
      .head { display: none; }
      .rowgrid {
        grid-template-columns: 36px minmax(0, 1fr) auto;
        grid-template-areas: "rk who tot" "cells cells cells" "st st st";
        gap: 6px 10px;
        padding: 12px 14px;
      }
      .rk { grid-area: rk; align-self: start; }
      .who { grid-area: who; }
      .tot { grid-area: tot; }
      .st { grid-area: st; flex-direction: row; flex-wrap: wrap; }
      .cells { grid-area: cells; grid-template-columns: repeat(2, 1fr); }
      .cell { flex-wrap: wrap; justify-content: flex-start; }
      .cell::before { display: inline; }
      .detail { padding: 10px 14px 14px; }
      .simrow { grid-template-columns: 1fr; }
      .cut { padding: 6px 14px; }
      .rut-table th, .rut-table td { padding: 6px 8px; font-size: 12px; }
      .club-filter { margin-left: 0; }
    }

    .flag-pt {
      height: 1em;
      width: auto;
      vertical-align: -0.15em;
      margin-left: 3px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Competições">
      <div class="sb-brand">Trampolins <img src="https://flagcdn.com/pt.svg" class="flag-pt" alt="Portugal"></div>
      <nav class="sb-nav" id="navComp"></nav>
    </aside>

    <div class="main">
      <header>
        <div class="eyebrow" id="eyebrow">Rankings · Trampolins</div>
        <h1 id="titulo">Rankings Trampolins</h1>
        <p class="sub" id="sub"></p>
      </header>

      <div class="controls">
        <div class="seg" role="tablist" aria-label="Sub-vista" id="tabsSub"></div>
        <div class="seg" role="tablist" aria-label="Escalão" id="tabsAge" hidden></div>
        <div class="seg" role="tablist" aria-label="Género" id="tabsSex"></div>
        <div class="club-filter" id="clubFilterBox" hidden>
          <label for="clubFilter" class="hint">Clube</label>
          <select id="clubFilter"></select>
        </div>
      </div>

      <div class="facts" id="facts"></div>
      <div id="trackerBox"></div>
      <div id="legendBox"></div>

      <section class="board" aria-label="Seriação">
        <div class="head" id="head"></div>
        <ol id="list"></ol>
      </section>

      <section class="panel" aria-labelledby="simh">
        <div class="pbody" style="padding-top:16px">
          <h2 id="simh">Simulador</h2>
          <p class="hint" id="simHint">Escolhe uma ginasta e mete resultados hipotéticos (ou altera os existentes). A seriação acima recalcula logo.</p>
          <div class="simbar">
            <label for="simAth" class="hint">Ginasta</label>
            <select id="simAth"></select>
            <button class="btn" id="simReset" type="button">Repor esta ginasta</button>
            <button class="btn" id="simResetAll" type="button">Repor tudo</button>
          </div>
          <div class="simrows" id="simRows"></div>
        </div>
      </section>

      <footer>
        <span>© 2026 <b>Daniel Cavaco</b></span>
      </footer>
    </div>
  </div>

  <div class="live-pill" id="liveBadge" hidden aria-live="polite">
    <span class="live-pulse" aria-hidden="true"></span>
    <span>Resultados em direto</span>
  </div>

  <script src="engine.js"></script>
  <script>
    (function () {
      'use strict';
      var A = window.Apuramento;
      var S = {
        comps: [],
        activeId: '',
        cache: {},
        laView: 'fig',
        disc: 'TRI',
        age: '',
        sex: 'F',
        club: '',
        detail: null,
        ov: {},
        simId: ''
      };
      var $ = function (s) { return document.querySelector(s); };
      var nf = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 3 });
      var fmt = function (n) { return n === null || n === undefined ? '—' : nf.format(n); };
      var nfPts = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      var fmtPts = function (n) { return n === null || n === undefined ? '—' : nfPts.format(n); };

      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      };

      var SEX = { F: 'Feminino', M: 'Masculino' };
      var DEFAULT_DISC_ORDER = ['TRI', 'TRA', 'SYN', 'DMT', 'TUM'];
      var DISC_SHORT = { TRI: 'TRA', TRA: 'TRA', SYN: 'SYN', DMT: 'DMT', TUM: 'TUM' };
      var AGE_ORDER = ['11-12', '13-14', 'JUN', '17-21', 'SEN'];

      /* Mapa completo NOC (IOC) -> ISO 3166-1 alpha-2 para todas as federações FIG */
      var NOC_TO_ISO2 = {
        ALB: 'al', ALG: 'dz', ANG: 'ao', ARG: 'ar', ARM: 'am', ARU: 'aw', ASA: 'as', AUS: 'au', AUT: 'at', AZE: 'az',
        BAH: 'bs', BAN: 'bd', BAR: 'bb', BEL: 'be', BEN: 'bj', BER: 'bm', BIH: 'ba', BLR: 'by', BOL: 'bo', BOT: 'bw',
        BRA: 'br', BRN: 'bh', BUL: 'bg', BUR: 'bf', CAN: 'ca', CAY: 'ky', CGO: 'cg', CHI: 'cl', CHN: 'cn', CIV: 'ci',
        CMR: 'cm', COD: 'cd', COK: 'ck', COL: 'co', CPV: 'cv', CRC: 'cr', CRO: 'hr', CUB: 'cu', CYP: 'cy', CZE: 'cz',
        DEN: 'dk', DOM: 'do', ECU: 'ec', EGY: 'eg', ESA: 'sv', ESP: 'es', EST: 'ee', ETH: 'et', FIJ: 'fj', FIN: 'fi',
        FRA: 'fr', GAB: 'ga', GBR: 'gb', GEO: 'ge', GER: 'de', GHA: 'gh', GRE: 'gr', GUA: 'gt', GUM: 'gu', HAI: 'ht',
        HKG: 'hk', HON: 'hn', HUN: 'hu', INA: 'id', IND: 'in', IRI: 'ir', IRL: 'ie', IRQ: 'iq', ISL: 'is', ISR: 'il',
        ITA: 'it', JAM: 'jm', JOR: 'jo', JPN: 'jp', KAZ: 'kz', KEN: 'ke', KGZ: 'kg', KOR: 'kr', KSA: 'sa', KUW: 'kw',
        LAO: 'la', LAT: 'lv', LBA: 'ly', LBN: 'lb', LTU: 'lt', LUX: 'lu', MAC: 'mo', MAR: 'ma', MAS: 'my', MDA: 'md',
        MEX: 'mx', MGL: 'mn', MKD: 'mk', MLT: 'mt', MNE: 'me', MRI: 'mu', NAM: 'na', NCA: 'ni', NED: 'nl', NEP: 'np',
        NGR: 'ng', NOR: 'no', NZL: 'nz', PAK: 'pk', PAN: 'pa', PAR: 'py', PER: 'pe', PHI: 'ph', PLE: 'ps', PNG: 'pg',
        POL: 'pl', POR: 'pt', PRK: 'kp', PUR: 'pr', QAT: 'qa', ROU: 'ro', RSA: 'za', RUS: 'ru', SAM: 'ws', SEN: 'sn',
        SEY: 'sc', SGP: 'sg', SLE: 'sl', SLO: 'si', SMR: 'sm', SRB: 'rs', SRI: 'lk', SUD: 'sd', SUI: 'ch', SVK: 'sk',
        SWE: 'se', SWZ: 'sz', SYR: 'sy', TGA: 'to', THA: 'th', TJK: 'tj', TKM: 'tm', TPE: 'tw', TTO: 'tt', TUN: 'tn',
        TUR: 'tr', UAE: 'ae', UGA: 'ug', UKR: 'ua', URU: 'uy', USA: 'us', UZB: 'uz', VEN: 've', VIE: 'vn', YEM: 'ye',
        ZAM: 'zm', ZIM: 'zw'
      };

      function nocBadge(noc, isPor) {
        var code = (noc || '').toUpperCase();
        var iso = NOC_TO_ISO2[code];
        var flagHtml = '';
        if (iso) {
          flagHtml = '<img src="https://flagcdn.com/' + iso + '.svg" class="noc-flag" alt="' + esc(code) + '" loading="lazy">';
        } else if (code === 'AIN') {
          flagHtml = '<svg class="noc-flag" viewBox="0 0 14 10" aria-label="AIN"><rect width="14" height="10" fill="#77B5AA"/><circle cx="7" cy="5" r="2.6" fill="none" stroke="#FFFFFF" stroke-width="1"/></svg>';
        }
        return '<span class="noc-tag' + (isPor ? ' por' : '') + '">' + esc(code) + flagHtml + '</span>';
      }

      function today() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function evState(ev) {
        var t = today();
        if (ev.fim && t > ev.fim) return 'done';
        if (ev.inicio && t >= ev.inicio && t <= ev.fim) return 'live';
        return 'future';
      }

      var STATE_L = { done: 'concluída', live: 'a decorrer', future: 'por realizar' };

      function getJSON(u) {
        return fetch(u, { cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status + ' ao abrir ' + u);
          return r.text().then(function (txt) {
            try {
              return JSON.parse(txt);
            } catch (err) {
              throw new Error('JSON inválido em ' + u + ': ' + err.message);
            }
          });
        });
      }

      var params = new URLSearchParams(location.search);

      function activeCompMeta() {
        return S.comps.filter(function (c) { return c.id === S.activeId; })[0] || S.comps[0];
      }

      function loadCompetition(compMeta) {
        if (S.cache[compMeta.id]) return Promise.resolve(S.cache[compMeta.id]);
        var resUrl = (params.get('teste') === '1' && compMeta.testResults) ? compMeta.testResults : compMeta.results;
        var reqs = [getJSON(compMeta.config), getJSON(resUrl)];
        if (compMeta.athletes) reqs.push(getJSON(compMeta.athletes));
        return Promise.all(reqs).then(function (arr) {
          var pack = {
            cfg: arr[0],
            meta: arr[1],
            res: arr[1].resultados || {},
            ath: arr[2] || []
          };
          S.cache[compMeta.id] = pack;
          return pack;
        });
      }

      var FALLBACK_COMPS = [
        {
          id: 'eg27',
          engine: 'fgp_minimos',
          ordemData: '2027-06-16',
          curto: 'EG 2027',
          nome: 'Jogos Europeus 2027',
          config: 'data/config.json',
          athletes: 'data/athletes.json',
          results: 'data/results.json',
          testResults: 'data/test-live.json'
        },
        {
          id: 'og28',
          engine: 'fig_olympic',
          ordemData: '2028-07-14',
          curto: 'OG 2028',
          nome: 'Jogos Olímpicos 2028',
          config: 'data/og28-config.json',
          results: 'data/og28-results.json'
        }
      ];

      getJSON('data/competitions.json')
        .catch(function (err) {
          if (String(err.message).indexOf('HTTP 404') >= 0) return FALLBACK_COMPS;
          throw err;
        })
        .then(function (list) {
          var hoje = today();
          var mostrarTodas = params.get('todas') === '1';

          S.comps = list
            .filter(function (c) {
              if (mostrarTodas) return true;
              if (c.visivelDe && hoje < c.visivelDe) return false;
              if (c.visivelAte && hoje > c.visivelAte) return false;
              return true;
            })
            .sort(function (a, b) {
              return String(a.ordemData || '9999-12-31').localeCompare(String(b.ordemData || '9999-12-31'));
            });

          if (!S.comps.length) throw new Error('Sem competições ativas neste momento.');
          fromHash();
          var comp = activeCompMeta();
          S.activeId = comp.id;
          return loadCompetition(comp).then(renderAll);
        })
        .catch(function (e) {
          $('#list').innerHTML = '<li class="row"><div class="detail"><p>Não foi possível carregar os dados (' + esc(e.message) + ').</p></div></li>';
        });

      function fromHash() {
        var h = (location.hash || '').replace('#', '').toLowerCase().split('-');
        if (!h[0]) return;
        var found = S.comps.filter(function (c) { return c.id.toLowerCase() === h[0]; })[0];
        if (found) {
          S.activeId = found.id;
          if (found.engine === 'fig_olympic' || found.engine === 'la28') {
            if (h[1] === 'fgp' || h[1] === 'fig') S.laView = h[1];
            if (h[2] && SEX[h[2].toUpperCase()]) S.sex = h[2].toUpperCase();
          } else {
            if (h[1]) S.disc = h[1].toUpperCase();
            if (h[2] && SEX[h[2].toUpperCase()]) S.sex = h[2].toUpperCase();
          }
        } else if (h.length === 2 && SEX[h[1].toUpperCase()]) {
          S.disc = h[0].toUpperCase();
          S.sex = h[1].toUpperCase();
        }
      }

      function syncHash() {
        var comp = activeCompMeta();
        if (!comp) return;
        var isOlympic = comp.engine === 'fig_olympic' || comp.engine === 'la28';
        var hash = isOlympic
          ? ('#' + comp.id + '-' + S.laView + '-' + S.sex.toLowerCase())
          : ('#' + comp.id + '-' + S.disc.toLowerCase() + '-' + S.sex.toLowerCase());
        try { history.replaceState(null, '', hash); }
        catch (e) { location.hash = hash; }
      }

      function discKeysFor(cfg) {
        var keys = Object.keys(cfg.disciplinas || {});
        return DEFAULT_DISC_ORDER.filter(function (k) { return keys.indexOf(k) >= 0; })
          .concat(keys.filter(function (k) { return DEFAULT_DISC_ORDER.indexOf(k) < 0; }));
      }

      /* ---------- menu lateral, cabeçalho e badge live contextual ---------- */
      function renderChrome(pack) {
        var comp = activeCompMeta();
        var cfg = pack.cfg;
        var isOlympic = comp.engine === 'fig_olympic' || comp.engine === 'la28';

        $('#navComp').innerHTML = S.comps.map(function (c) {
          var isCur = c.id === comp.id;
          return '<button type="button" class="sb-btn" data-compid="' + esc(c.id) + '" aria-current="' + (isCur ? 'page' : 'false') + '">' +
            '<b>' + esc(c.nome) + '</b><small>' + esc(c.curto) + '</small></button>';
        }).join('');

        $('#eyebrow').textContent = 'Rankings · ' + comp.curto;
        $('#titulo').textContent = cfg.titulo || comp.nome;
        $('#sub').textContent = cfg.local + ' · ' + cfg.datas;

        var tabsAge = $('#tabsAge');

        if (!isOlympic) {
          var dKeys = discKeysFor(cfg);
          if (!cfg.disciplinas[S.disc]) S.disc = dKeys[0];

          $('#tabsSub').innerHTML = dKeys.map(function (d) {
            var label = DISC_SHORT[d] || d;
            return '<button role="tab" type="button" data-d="' + d + '" aria-selected="' + (d === S.disc && !S.club) + '">' + esc(label) + '</button>';
          }).join('');

          var ages = [];
          if (Array.isArray(cfg.escaloes) && cfg.escaloes.length) {
            ages = cfg.escaloes.slice();
          } else if (Array.isArray(pack.ath)) {
            pack.ath.forEach(function (a) {
              var escVal = (a.escalao || a.age || '').trim().toUpperCase();
              if (escVal && ages.indexOf(escVal) < 0) ages.push(escVal);
            });
          }
          ages.sort(function (a, b) {
            var ia = AGE_ORDER.indexOf(a), ib = AGE_ORDER.indexOf(b);
            if (ia >= 0 && ib >= 0) return ia - ib;
            if (ia >= 0) return -1;
            if (ib >= 0) return 1;
            return a.localeCompare(b, 'pt');
          });

          if (ages.length > 1) {
            if (!S.age || ages.indexOf(S.age) < 0) S.age = ages[0];
            tabsAge.hidden = false;
            tabsAge.innerHTML = ages.map(function (ag) {
              return '<button role="tab" type="button" data-age="' + esc(ag) + '" aria-selected="' + (ag === S.age && !S.club) + '">' + esc(ag) + '</button>';
            }).join('');
          } else {
            S.age = ages[0] || '';
            tabsAge.hidden = true;
            tabsAge.innerHTML = '';
          }
        } else {
          S.age = '';
          tabsAge.hidden = true;
          tabsAge.innerHTML = '';
          $('#tabsSub').innerHTML =
            '<button role="tab" type="button" data-laview="fig" aria-selected="' + (S.laView === 'fig') + '"><span class="short">FIG</span><span class="full">Ranking Internacional (FIG)</span></button>' +
            '<button role="tab" type="button" data-laview="fgp" aria-selected="' + (S.laView === 'fgp') + '"><span class="short">FGP</span><span class="full">Ranking Nacional (FGP)</span></button>';
        }

        var sexes = ['F', 'M'];
        if (!isOlympic && Array.isArray(pack.ath) && pack.ath.length) {
          var foundSexes = ['F', 'M'].filter(function (sx) {
            return pack.ath.some(function (a) { return a.sexo === sx; });
          });
          if (foundSexes.length) sexes = foundSexes;
        }
        if (sexes.indexOf(S.sex) < 0) S.sex = sexes[0];

        $('#tabsSex').innerHTML = sexes.map(function (s) {
          return '<button role="tab" type="button" data-s="' + s + '" aria-selected="' + (s === S.sex && !S.club) + '">' + s + '</button>';
        }).join('');

        /* Filtro de Clube */
        var clubBox = $('#clubFilterBox');
        if (!isOlympic && Array.isArray(pack.ath)) {
          var clubs = [];
          pack.ath.forEach(function (a) {
            var c = (a.clube || '').trim();
            if (c && clubs.indexOf(c) < 0) clubs.push(c);
          });
          clubs.sort(function (a, b) { return a.localeCompare(b, 'pt'); });
          if (S.club && clubs.indexOf(S.club) < 0) S.club = '';
          clubBox.hidden = clubs.length === 0;
          $('#clubFilter').innerHTML = '<option value="">Todos os clubes</option>' +
            clubs.map(function (c) {
              return '<option value="' + esc(c) + '"' + (c === S.club ? ' selected' : '') + '>' + esc(c) + '</option>';
            }).join('');
        } else {
          S.club = '';
          clubBox.hidden = true;
        }

        var hasLiveEvent = Array.isArray(cfg.eventos) && cfg.eventos.some(function (ev) { return evState(ev) === 'live'; });
        var isLive = Boolean(cfg.liveManual || pack.meta.live || (params.get('live') === '1' && comp.id === 'eg27') || hasLiveEvent);
        $('#liveBadge').hidden = !isLive;
      }

      /* =====================================================================
         MOTOR 1: APURAMENTO NACIONAL POR MÍNIMOS (EG27, CM27, etc.)
         ===================================================================== */
      function getOvEG(compId) {
        S.ov[compId] = S.ov[compId] || {};
        return S.ov[compId];
      }

      function computeEG(comp, pack) {
        var en = pack.ath.filter(function (a) {
          var matchAge = !S.age || !a.escalao || a.escalao.toUpperCase() === S.age;
          return a.disc === S.disc && a.sexo === S.sex && matchAge;
        });
        var ovObj = getOvEG(comp.id);
        var hasAnyOv = Object.keys(ovObj).some(function (e) { return Object.keys(ovObj[e]).length; });
        var ov = hasAnyOv ? ovObj : null;
        var R = A.rank(pack.cfg, S.disc, S.sex, en, pack.res, ov);
        var base = ov ? A.rank(pack.cfg, S.disc, S.sex, en, pack.res, null) : R;
        var br = {};
        base.rows.forEach(function (r) { br[r.entry.id] = r.rank; });
        return { R: R, br: br, entries: en };
      }

      function renderDetailDrawerEG(r, ev, dc, useExcelencia) {
        var p = r.per[ev.id];
        var rec = p.rec || {};
        var rot = rec.rotinas || {};
        var html = '<div class="detail" role="region" aria-label="Detalhe de ' + esc(r.entry.nome) + ' em ' + esc(ev.curto) + '">';
        html += '<div class="detail-head"><h3>' + esc(r.entry.nome) + ' — ' + esc(ev.nome) + ' (' + esc(ev.curto) + ')' + (p.simulated ? ' · Simulação' : '') + '</h3>';
        html += '<button type="button" class="detail-close" data-close-detail="1">Fechar</button></div>';

        if (p.simulated) {
          var simRows = dc.tipo === 'late'
            ? [['q1', 'Q1'], ['q2', 'Q2'], ['f', 'Final']]
            : (useExcelencia ? [['q1', 'Q1'], ['f1', 'Final 1'], ['f2', 'Final 2'], ['ne', 'Nota de excelência']] : [['q1', 'Q1'], ['f1', 'Final 1'], ['f2', 'Final 2']]);
          var activeSim = simRows.filter(function (sr) { return typeof rec[sr[0]] === 'number'; });

          if (activeSim.length) {
            html += '<table class="rut-table"><thead><tr><th>Fase (Simulação)</th><th>Total</th></tr></thead><tbody>';
            activeSim.forEach(function (sr) {
              html += '<tr><td>' + esc(sr[1]) + '</td><td><b>' + fmt(rec[sr[0]]) + '</b></td></tr>';
            });
            html += '</tbody></table>';
          }
        } else {
          var phases;
          if (dc.tipo === 'late') {
            phases = (rot.q1_1 || rot.q1_2)
              ? [['q1_1', 'Q1 · Série 1'], ['q1_2', 'Q1 · Série 2'], ['q2', 'Q2'], ['f', 'Final']]
              : [['q1', 'Q1'], ['q2', 'Q2'], ['f', 'Final']];
          } else {
            var allNePhases = [
              ['q1_1', 'Q1 · Série 1'], ['q1_2', 'Q1 · Série 2'],
              ['q2', 'Q2'], ['tf', 'Team Final'], ['aa', 'All-Around Team Final'],
              ['f1', 'Final 1'], ['f2', 'Final 2']
            ];
            var extraNeKeys = ['q2', 'tf', 'aa'];
            phases = allNePhases.filter(function (ph) {
              var k = ph[0];
              if (extraNeKeys.indexOf(k) >= 0) return p.neReached && p.nePhase === k;
              return true;
            });
          }

          var activePhases = phases.filter(function (ph) { return rot[ph[0]]; });

          if (activePhases.length) {
            html += '<table class="rut-table"><thead><tr>';
            if (dc.tipo === 'late') {
              html += '<th>Fase</th><th>E</th><th>D</th><th>HD</th><th>ToF</th><th>Pen.</th><th>Total</th>';
            } else {
              html += '<th>Série</th><th>E</th><th>D</th><th>Pen.</th><th>Total</th>';
            }
            html += '</tr></thead><tbody>';

            activePhases.forEach(function (ph) {
              var k = ph[0], label = ph[1], rt = rot[k];
              var used = p.usedPhases && p.usedPhases.indexOf(k) >= 0;
              var isExcRow = p.neReached && p.nePhase === k;
              var badges = '';
              if (used) badges += '<span class="rut-badge">conta</span>';
              if (isExcRow) {
                badges += '<span class="rut-badge"' + (!p.neValid ? ' style="text-decoration:line-through;opacity:.75"' : '') + '>exc</span>';
              }
              html += '<tr class="' + ((used || (isExcRow && p.neValid)) ? 'used' : '') + '">';
              html += '<td>' + esc(label) + badges + '</td>';
              html += '<td>' + fmt(rt.e) + '</td>';
              html += '<td>' + fmt(rt.d) + '</td>';
              if (dc.tipo === 'late') {
                html += '<td>' + fmt(rt.hd) + '</td>';
                html += '<td>' + fmt(rt.tof) + '</td>';
              }
              html += '<td>' + (rt.p ? fmt(rt.p) : '0.00') + '</td>';
              html += '<td><b>' + fmt(rt.total) + '</b></td>';
              html += '</tr>';
            });
            html += '</tbody></table>';
          }
        }

        if (p.items && p.items.length) {
          html += '<ul class="detail-notes">';
          p.items.forEach(function (it) {
            var cls = it.pending ? 'pend' : (it.ok ? 'ok' : 'no');
            html += '<li class="' + cls + '">' + esc(it.label) + ': <b>' + (it.value !== null ? fmt(it.value) : '—') + '</b>' + (it.note ? ' (' + esc(it.note) + ')' : '') + '</li>';
          });
          html += '</ul>';
        } else if (!p.simulated) {
          html += '<p class="hint" style="margin:0">Sem detalhe por série registado para esta prova.</p>';
        }

        html += '</div>';
        return html;
      }

      function renderBoardEG(comp, pack) {
        var cfg = pack.cfg;

        /* --- MODO CLUBE: mostra todos os ginastas do clube em todas as disciplinas/géneros --- */
        if (S.club) {
          var dKeys = discKeysFor(cfg);
          var ovObj = getOvEG(comp.id);
          var hasAnyOv = Object.keys(ovObj).some(function (e) { return Object.keys(ovObj[e]).length; });
          var ov = hasAnyOv ? ovObj : null;

          var groups = [];
          var totalAthletes = 0;
          var totalVagas = 0;

          dKeys.forEach(function (dKey) {
            ['F', 'M'].forEach(function (sx) {
              var en = pack.ath.filter(function (a) { return a.disc === dKey && a.sexo === sx; });
              if (!en.length) return;
              var R = A.rank(cfg, dKey, sx, en, pack.res, ov);
              var clubRows = R.rows.filter(function (r) { return (r.entry.clube || '').trim() === S.club; });
              if (clubRows.length) {
                totalAthletes += clubRows.length;
                totalVagas += clubRows.filter(function (r) { return r.naVaga; }).length;
                groups.push({
                  disc: dKey,
                  discLabel: DISC_SHORT[dKey] || dKey,
                  discNome: cfg.disciplinas[dKey].nome,
                  dc: cfg.disciplinas[dKey],
                  sex: sx,
                  R: R,
                  rows: clubRows
                });
              }
            });
          });

          $('#facts').innerHTML =
            '<div class="fact"><span>Clube</span><b>' + esc(S.club) + '</b></div>' +
            '<div class="fact"><span>Ginastas em apuramento</span><b>' + totalAthletes + '</b></div>' +
            '<div class="fact good"><span>Dentro das vagas</span><b>' + totalVagas + '</b></div>';
          $('#trackerBox').innerHTML = '';
          $('#legendBox').innerHTML = '';

          var allEvs = cfg.eventos || [];
          var nEv = allEvs.length;
          $('#head').innerHTML = '<span>#</span><span>Ginasta</span><span class="cells" style="--cols:' + nEv + '">' + allEvs.map(function (ev) {
            var st = evState(ev);
            return '<span class="hcell"><b><span class="dot ' + st + '"></span>' + esc(ev.curto) + '</b><i>' + esc(ev.datas) + '</i></span>';
          }).join('') + '</span><span style="text-align:right">Total</span><span>Estado</span>';

          var htmlClub = '';
          groups.forEach(function (g) {
            var m = g.R.minimos;
            var minTxt = g.dc.tipo === 'late'
              ? ('Q1 ' + fmt(m.q1) + ' · Q2/Final ' + fmt(m.late))

            g.rows.forEach(function (r) {

          $('#list').innerHTML = htmlClub || '<li class="row"><div class="detail"><p>Sem ginastas registados para este clube.</p></div></li>';
          renderSimEG(comp, pack, computeEG(comp, pack));
          return;
        }

        /* --- MODO NORMAL (POR DISCIPLINA / GÉNERO) --- */
        var C = computeEG(comp, pack), R = C.R, d = S.disc, dc = cfg.disciplinas[d];
        var m = R.minimos;
        var minTxt = dc.tipo === 'late'

        var html = '', cutDone = false;
        R.rows.forEach(function (r, i) {

          var cells = R.eventos.map(function (ev) {

          html += '<li class="row' + (r.rank === null ? ' out' : '') + '">' +

      function fieldsForEG(tipo, useExcelencia) {
        if (tipo === 'late') return [['q1', 'Q1'], ['q2', 'Q2'], ['f', 'Final']];
        return useExcelencia
          ? [['q1', 'Q1'], ['f1', 'F1'], ['f2', 'F2'], ['ne', 'Excelência']]
          : [['q1', 'Q1'], ['f1', 'F1'], ['f2', 'F2']];

      function renderSimEG(comp, pack, C) {
        $('#simHint').textContent = 'Escolhe uma ginasta e mete resultados hipotéticos (ou altera os existentes). A seriação acima recalcula logo.';

            return '<label class="fld">' + f[1] + '<input type="text" inputmode="decimal" autocomplete="off" data-ev="' + ev.id + '" data-f="' + f[0] + '" value="' + (v === undefined ? '' : String(v)) + '" class="' + (mod ? 'mod' : '') + '" placeholder="—"></label>';
          }).join('');
          var res = '';
          var rowObj = C.R.rows.filter(function (r) { return r.entry.id === S.simId; })[0];

        }).join('');

      /* =====================================================================
         MOTOR 2: APURAMENTO OLÍMPICO FIG + NACIONAL FGP

      function getOvLA(compId) {
        S.ov[compId] = S.ov[compId] || { F: {}, M: {} };
        return S.ov[compId];
      }

      function computeLA28(comp, pack) {
        var ovObj = getOvLA(comp.id);
        var hasAny = ['F', 'M'].some(function (sx) {
          return Object.keys(ovObj[sx]).some(function (ev) { return Object.keys(ovObj[sx][ev]).length; });
        });
        var laData = Object.assign({}, pack.cfg, { resultados: pack.res });
        return A.rankLA28(laData, S.sex, hasAny ? ovObj : null);
      }

      function renderBoardLA28(comp, pack) {

            if (r.quotaState === 'safe' && next && next.quotaState !== 'safe' && !cutSafeDone) {
              cutSafeDone = true;
              htmlFgp += '<li class="cut" aria-hidden="true"><span>Limite de vagas garantidas de Portugal</span><span>' + sum.porQuotasSafe + '</span></li>';
            }
            if ((r.quotaState === 'safe' || r.quotaState === 'bubble') && next && next.quotaState === 'out' && !cutBubbleDone && sum.porQuotasBubble > 0) {
              cutBubbleDone = true;
              htmlFgp += '<li class="cut bubble" aria-hidden="true"><span>Limite provisório (zona de corte internacional)</span><span>' + (sum.porQuotasSafe + sum.porQuotasBubble) + '</span></li>';
            }
          });

          $('#list').innerHTML = htmlFgp || '<li class="row"><div class="detail"><p>Sem ginastas portugueses com resultados registados.</p></div></li>';
        }

        renderSimLA28(comp, pack, R);
      }

      function renderSimLA28(comp, pack, R) {
        $('#simHint').textContent = 'Simula classificações (1.º a 30.º) nas Taças do Mundo ou Mundial 2027. Atualiza em simultâneo o Ranking Internacional e o Ranking Nacional.';
        var list = S.laView === 'fgp'
          ? R.fgpRows.map(function (r) { return r.ath; })
          : R.figRows.map(function (r) { return r.ath; });

        var sel = $('#simAth');
        sel.innerHTML = '<option value="">Escolher ginasta…</option>' + list.map(function (a) {
          return '<option value="' + esc(a.id) + '"' + (a.id === S.simId ? ' selected' : '') + '>' + esc(a.nome) + ' (' + esc(a.noc) + ')</option>';
        }).join('');

        var box = $('#simRows');
        if (!S.simId) { box.innerHTML = ''; return; }

        var athObj = list.filter(function (a) { return a.id === S.simId; })[0];
        if (!athObj) { box.innerHTML = ''; return; }
        var ovObj = getOvLA(comp.id);

        box.innerHTML = R.eventos.map(function (ev) {
          var real = (pack.res[S.sex] && pack.res[S.sex][ev.id] && pack.res[S.sex][ev.id][S.simId]) || null;
          var ov = ovObj[S.sex][ev.id] && ovObj[S.sex][ev.id][S.simId];
          var cur = ov !== undefined ? (ov || {}) : (real || {});
          var mod = ov !== undefined;
          var ptsNow = cur.rank ? A.pointsFromRank(cur.rank) : 0;

          var extraFields = ev.tipo === 'wch'
            ? '<label class="fld">Lugar Final CM27<input type="text" inputmode="numeric" data-laev="' + ev.id + '" data-laf="finalRank" value="' + (cur.finalRank || '') + '" class="' + (mod ? 'mod' : '') + '" placeholder="1-8"></label>' +
              '<label class="fld">Lugar Q2 CM27<input type="text" inputmode="numeric" data-laev="' + ev.id + '" data-laf="q2Rank" value="' + (cur.q2Rank || '') + '" class="' + (mod ? 'mod' : '') + '" placeholder="1-24"></label>'
            : '';

          return '<div class="simrow">' +
            '<div class="en">' + esc(ev.nome) + '<small>' + esc(ev.datas) + '</small></div>' +
            '<div><div class="fields">' +
            '<label class="fld">Classificação<input type="text" inputmode="numeric" data-laev="' + ev.id + '" data-laf="rank" value="' + (cur.rank || '') + '" class="' + (mod ? 'mod' : '') + '" placeholder="1-30"></label>' +
            extraFields +
            '</div><div class="res tn">' + (ptsNow > 0 ? '<b>' + ptsNow + ' pontos FIG</b>' : 'Sem pontos Top 30') + '</div></div></div>';
        }).join('');
      }

      /* =====================================================================
         ORQUESTRAÇÃO E EVENTOS
         ===================================================================== */
      function renderAll() {
        var comp = activeCompMeta();
        if (!comp) return;
        var isOlympic = comp.engine === 'fig_olympic' || comp.engine === 'la28';
        loadCompetition(comp).then(function (pack) {
          renderChrome(pack);
          if (!isOlympic) renderBoardEG(comp, pack);
          else renderBoardLA28(comp, pack);
        }).catch(function (err) {
          console.error(err);
          $('#list').innerHTML = '<li class="row"><div class="detail"><p>Erro ao processar dados (' + esc(err.message) + ').</p></div></li>';
        });
      }

      $('#navComp').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-compid]');
        if (!b || b.dataset.compid === S.activeId) return;
        S.activeId = b.dataset.compid;
        S.club = '';
        S.simId = '';
        S.detail = null;
        syncHash();
        renderAll();
      });

      $('#tabsSub').addEventListener('click', function (e) {
        var bd = e.target.closest('button[data-d]');
        if (bd) {
          S.disc = bd.dataset.d;
          S.club = '';
          S.simId = '';
          S.detail = null;
          syncHash();
          renderAll();
          return;
        }
        var bl = e.target.closest('button[data-laview]');
        if (bl) {
          S.laView = bl.dataset.laview;
          S.simId = '';
          syncHash();
          renderAll();
        }
      });

      $('#tabsAge').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-age]');
        if (!b) return;
        S.age = b.dataset.age;
        S.club = '';
        S.simId = '';
        S.detail = null;
        syncHash();
        renderAll();
      });

      $('#tabsSex').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-s]');
        if (!b) return;
        S.sex = b.dataset.s;
        S.club = '';
        S.simId = '';
        S.detail = null;
        syncHash();
        renderAll();
      });

      $('#clubFilter').addEventListener('change', function (e) {
        S.club = e.target.value;
        S.detail = null;
        renderAll();
      });

      $('#list').addEventListener('click', function (e) {
        var btn = e.target.closest('button.cell[data-ath]');
        if (btn) {
          var athId = btn.dataset.ath, evId = btn.dataset.ev;
          if (S.detail && S.detail.athId === athId && S.detail.evId === evId) S.detail = null;
          else S.detail = { athId: athId, evId: evId };
          renderAll();
          return;
        }
        if (e.target.closest('[data-close-detail]')) {
          S.detail = null;
          renderAll();
        }
      });

      $('#simAth').addEventListener('change', function (e) {
        S.simId = e.target.value;
        renderAll();
      });

      $('#simRows').addEventListener('change', function (e) {
        var t = e.target;
        var comp = activeCompMeta();
        var pack = S.cache[comp.id];
        if (!pack) return;
        var isOlympic = comp.engine === 'fig_olympic' || comp.engine === 'la28';

        if (!isOlympic) {
          if (!t.dataset || !t.dataset.ev) return;
          var evId = t.dataset.ev, id = S.simId, rec = {};
          var dc = pack.cfg.disciplinas[S.disc];
          var useExc = dc.usarExcelencia !== undefined ? dc.usarExcelencia : (pack.cfg.usarExcelencia !== false);
          var ovObj = getOvEG(comp.id);
          document.querySelectorAll('#simRows input[data-ev="' + evId + '"]').forEach(function (i) {
            var s = String(i.value).trim().replace(',', '.');
            var n = parseFloat(s);
            if (s && isFinite(n)) rec[i.dataset.f] = n;
          });
          var rawReal = pack.res[evId] && pack.res[evId][id];
          var real = A.hydrateRec(rawReal, dc.tipo);
          var simFields = fieldsForEG(dc.tipo, useExc).map(function (f) { return f[0]; });
          if (real && real.agg !== undefined) simFields = ['agg'];
          var realKeys = real ? simFields.filter(function (k) { return real[k] !== undefined; }) : [];
          var recKeys = Object.keys(rec);
          var same = real && recKeys.length === realKeys.length && recKeys.every(function (k) { return real[k] === rec[k]; });

          if (same) {
            if (ovObj[evId]) delete ovObj[evId][id];
          } else if (!real && !recKeys.length) {
            if (ovObj[evId]) delete ovObj[evId][id];
          } else {
            if (real && real.neFlag && rec.ne === undefined) rec.neFlag = true;
            (ovObj[evId] = ovObj[evId] || {})[id] = rec;
          }
          renderAll();
        } else {
          if (!t.dataset || !t.dataset.laev) return;
          var lEv = t.dataset.laev, idL = S.simId;
          var ovObjL = getOvLA(comp.id);
          var realL = (pack.res[S.sex] && pack.res[S.sex][lEv] && pack.res[S.sex][lEv][idL]) || null;
          var allAths = computeLA28(comp, pack).figRows.map(function (r) { return r.ath; });
          var athMeta = allAths.filter(function (a) { return a.id === idL; })[0] || { nome: idL, noc: 'POR' };
          var patch = Object.assign({}, realL || { nome: athMeta.nome, noc: athMeta.noc });
          var hasAny = false;

          document.querySelectorAll('#simRows input[data-laev="' + lEv + '"]').forEach(function (inp) {
            var val = parseInt(String(inp.value).trim(), 10);
            if (isFinite(val) && val > 0) {
              patch[inp.dataset.laf] = val;
              hasAny = true;
            } else {
              delete patch[inp.dataset.laf];
            }
          });

          ovObjL[S.sex][lEv] = ovObjL[S.sex][lEv] || {};
          if (!hasAny) {
            ovObjL[S.sex][lEv][idL] = null;
          } else {
            ovObjL[S.sex][lEv][idL] = patch;
          }
          renderAll();
        }
      });

      $('#simReset').addEventListener('click', function () {
        var comp = activeCompMeta();
        var isOlympic = comp.engine === 'fig_olympic' || comp.engine === 'la28';
        if (!isOlympic) {
          var ovObj = getOvEG(comp.id);
          Object.keys(ovObj).forEach(function (ev) { delete ovObj[ev][S.simId]; });
        } else {
          var ovObjL = getOvLA(comp.id);
          Object.keys(ovObjL[S.sex]).forEach(function (ev) { delete ovObjL[S.sex][ev][S.simId]; });
        }
        renderAll();
      });

      $('#simResetAll').addEventListener('click', function () {
        var comp = activeCompMeta();
        var isOlympic = comp.engine === 'fig_olympic' || comp.engine === 'la28';
        if (!isOlympic) S.ov[comp.id] = {};
        else S.ov[comp.id] = { F: {}, M: {} };
        renderAll();
      });
    })();
  </script>
</body>
</html>
