<script>
    const CMGI_URL = 'https://sporttech.io/events/01a1be6a-b476-781a-a380-de9079956fde/ovs/';

    const OWNER = 'danielscavaco';
    const REPO = 'rankings-trampolins';
    const BRANCH = 'main';
    const FALLBACK_FILE = 'data/temp-cmgi-results.json';
    const RAW_GITHUB_URL = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FALLBACK_FILE}`;

    const DISC_MAP = { 0: 'TRI', 1: 'SYN', 2: 'DMT', 3: 'TUM' };
    const KIND_MAP = { 0: 'q1', 6: 'q2', 3: 'f', 8: 'f1', 7: 'f2' };

    const nf = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 3 });
    const fmt = v => (v === null || v === undefined) ? '—' : nf.format(v);

    function normalizeSex(s) {
      const str = String(s || '').toLowerCase();
      if (/\b(women|woman|female|girls|f)\b/.test(str)) return 'F';
      if (/\b(men|man|male|boys|m)\b/.test(str)) return 'M';
      return '';
    }

    function isPortuguese(ath) {
      const vals = [ath.Club, ath.Team, ath.Representing, ath.Country, ath.Nation, ath.NOC]
        .map(v => String(v || '').trim().toUpperCase());
      return vals.some(v => v === 'POR' || v === 'PRT' || /^POR\b/.test(v));
    }

    function isValidCompletedFrame(f) {
      if (!f || (f.State || 0) !== 3) return false;
      const log = String(f.ChangeLog || '');
      if (/\b(fail|dns)\b/i.test(log) && (f.MarkTTT_G || 0) === 0 && !f.DifficultyElements) return false;
      return true;
    }

    function parseFrameDetail(f) {
      const T = (f.MarkTTT_G || 0) / 1000.0;
      const E = f.ETotalT_G || 0;
      const D = (f.DifficultyT_G || 0) / 10.0;
      const H = f.Displacement_G || 0;
      const X = f.TimeTMS_G || 0;
      const P = (f.PenaltyT || 0) / 10.0;
      const B = (f.BonusT || 0) / 10.0;

      const out = { e: 0, d: Number(D.toFixed(3)), hd: 0, tof: 0, p: Number(P.toFixed(3)), total: Number(T.toFixed(3)) };
      for (const e of [E / 10.0, E / 1000.0, E / 100.0]) {
        for (const h of [H / 100.0, H / 10.0, H / 1000.0]) {
          for (const x of [X / 1000.0, (X * 2) / 100.0, X / 100.0, X / 10.0]) {
            if (Math.abs(e + D + h + x + B - P - T) < 0.006) {
              out.e = Number(e.toFixed(3));
              out.hd = Number(h.toFixed(3));
              out.tof = Number(x.toFixed(3));
              return out;
            }
          }
        }
      }
      return out;
    }

    const PROXIES = [
      u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
      u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
      u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
    ];

    let workingProxyIdx = 0;
    let resolvedBase = null;

    async function fetchWithTimeout(url, opts = {}, ms = 4500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), ms);
      try {
        return await fetch(url, { ...opts, signal: ctrl.signal, cache: 'no-store' });
      } finally {
        clearTimeout(id);
      }
    }

    async function fetchProxiedJson(targetUrl) {
      const sep = targetUrl.includes('?') ? '&' : '?';
      const bustedUrl = `${targetUrl}${sep}_=${Date.now()}`;

      for (let attempt = 0; attempt < PROXIES.length; attempt++) {
        const idx = (workingProxyIdx + attempt) % PROXIES.length;
        try {
          const res = await fetchWithTimeout(PROXIES[idx](bustedUrl), {}, 4000);
          if (!res.ok) continue;
          const data = await res.json();
          if (data && typeof data === 'object') {
            workingProxyIdx = idx;
            return data;
          }
        } catch (_) {}
      }
      throw new Error('Proxies CORS sem resposta');
    }

    async function getSporttechBase() {
      if (resolvedBase) return resolvedBase;
      const uuid = (CMGI_URL.match(/events\/([0-9a-f-]{36})/i) || [])[1];
      if (!uuid) throw new Error('UUID inválido em CMGI_URL');

      for (const base of [
        `https://sporttech.io/events/${uuid}/ovs/api/`,
        `https://sporttech.io/events/${uuid}/livescore/api/`,
        `https://sporttech.io/api/events/${uuid}/`
      ]) {
        try {
          const data = await fetchProxiedJson(`${base}event?fetch_event_competitions=true&fetch_competition_stages=true`);
          if (data && (data.Competitions || data.Stages || data.Id)) {
            resolvedBase = base;
            return base;
          }
        } catch (_) {}
      }
      throw new Error('Sem resposta da Sporttech');
    }

    async function fetchDirectFromSporttech() {
      const apiBase = await getSporttechBase();
      const evData = await fetchProxiedJson(`${apiBase}event?fetch_event_competitions=true&fetch_competition_stages=true`);
      const comps = evData.Competitions || {};
      const stages = evData.Stages || {};
      const athletesMap = new Map();

      const stageTasks = [];
      for (const c of Object.values(comps)) {
        if ((c.Title || '').toLowerCase() === 'test') continue;
        const disc = DISC_MAP[c.Discipline];
        if (!disc || disc === 'SYN') continue;
        const sexo = normalizeSex(`${c.SexCategory || ''} ${c.Title || ''}`);
        const escalao = String(c.AgeGroup || c.Title || 'OPEN').trim();

        for (const sid of (c.Stages || [])) {
          const st = stages[String(sid)] || stages[sid];
          if (!st) continue;
          const fase = KIND_MAP[st.Kind] || String(st.Kind);
          stageTasks.push({ sid, st, disc, sexo, escalao, fase });
        }
      }

      const stageResults = await Promise.all(
        stageTasks.map(t =>
          fetchProxiedJson(`${apiBase}stages/${t.sid}?fetch_stage_groups=true&fetch_group_performances=true&fetch_performance_athletes=true&fetch_performance_frames=true`)
            .then(det => ({ ...t, det }))
        )
      );

      for (const { st, disc, sexo, escalao, fase, det } of stageResults) {
        const A = det.Athletes || {};
        const P = det.Performances || {};
        const F = det.Frames || {};
        const lim = st.PerfomanceFramesLimit || 2;

        for (const p of Object.values(P)) {
          const athObjs = (p.Athletes || []).map(aid => A[String(aid)] || A[aid]).filter(Boolean);
          if (!athObjs.length || !athObjs.some(isPortuguese)) continue;

          const a = athObjs[0];
          const nome = `${a.GivenName || ''} ${a.Surname || ''}`.trim();
          const key = `${disc}|${escalao}|${sexo}|${nome}`;

          if (!athletesMap.has(key)) {
            athletesMap.set(key, { nome, disc, escalao, sexo, rotinas: {}, q1: null });
          }
          const rec = athletesMap.get(key);

          const routines = (p.Frames || []).slice(0, lim).map(fid => {
            const f = F[String(fid)] || F[fid];
            return isValidCompletedFrame(f) ? parseFrameDetail(f) : null;
          });

          const totalMk = (p.MarkTTT_G || 0) > 0 ? Number(((p.MarkTTT_G || 0) / 1000.0).toFixed(3)) : null;
          if (fase === 'q1') {
            if (totalMk !== null) rec.q1 = totalMk;
            if (routines[0]) rec.rotinas.q1_1 = routines[0];
            if (routines[1]) rec.rotinas.q1_2 = routines[1];
          }
        }
      }

      return [...athletesMap.values()].sort((a, b) =>
        a.disc.localeCompare(b.disc) || a.escalao.localeCompare(b.escalao) || a.nome.localeCompare(b.nome, 'pt')
      );
    }

    async function fetchFastGitHubRaw() {
      const res = await fetchWithTimeout(`${RAW_GITHUB_URL}?t=${Date.now()}`, {}, 4000);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    function calcPrelim(disc, r1, r2, q1Fallback) {
      const s1 = r1 ? r1.total : null;
      const s2 = r2 ? r2.total : null;
      if (disc === 'TRI') {
        const vals = [s1, s2].filter(v => typeof v === 'number');
        return vals.length ? Math.max(...vals) : (q1Fallback ?? null);
      }
      if (typeof s1 === 'number' && typeof s2 === 'number') return Number((s1 + s2).toFixed(3));
      if (typeof s1 === 'number') return s1;
      return q1Fallback ?? null;
    }

    function renderPenCell(p) {
      return (typeof p === 'number' && p > 0) ? `<td class="pen">-${fmt(p)}</td>` : '<td></td>';
    }

    function renderTables(aths) {
      const sections = [
        { code: 'TRI', label: 'Trampolim Individual (TRA)', isTra: true },
        { code: 'DMT', label: 'Duplo Mini-Trampolim (DMT)', isTra: false },
        { code: 'TUM', label: 'Tumbling (TUM)', isTra: false }
      ];

      document.getElementById('app').innerHTML = sections.map(sec => {
        const list = aths.filter(a => a.disc === sec.code);
        if (!list.length) return '';

        const hasPen1 = list.some(a => (a.rotinas?.q1_1?.p || 0) > 0);
        const hasPen2 = list.some(a => (a.rotinas?.q1_2?.p || 0) > 0);

        const head1 = sec.isTra
          ? `<th>E</th><th>D</th><th>HD</th><th>ToF</th>${hasPen1 ? '<th>Pen</th>' : ''}<th>Total</th>`
          : `<th>E</th><th>D</th>${hasPen1 ? '<th>Pen</th>' : ''}<th>Total</th>`;
        const head2 = sec.isTra
          ? `<th>E</th><th>D</th><th>HD</th><th>ToF</th>${hasPen2 ? '<th>Pen</th>' : ''}<th>Total</th>`
          : `<th>E</th><th>D</th>${hasPen2 ? '<th>Pen</th>' : ''}<th>Total</th>`;

        const cols1 = (sec.isTra ? 5 : 3) + (hasPen1 ? 1 : 0);
        const cols2 = (sec.isTra ? 5 : 3) + (hasPen2 ? 1 : 0);

        const renderCell = (r, showPen, cols) => {
          if (!r) return `<td colspan="${cols}" class="muted">—</td>`;
          const penTd = showPen ? renderPenCell(r.p) : '';
          if (sec.isTra) {
            return `<td>${fmt(r.e)}</td><td>${fmt(r.d)}</td><td>${fmt(r.hd)}</td><td>${fmt(r.tof)}</td>${penTd}<td><b>${fmt(r.total)}</b></td>`;
          }
          return `<td>${fmt(r.e)}</td><td>${fmt(r.d)}</td>${penTd}<td><b>${fmt(r.total)}</b></td>`;
        };

        const rows = list.map(a => {
          const rot = a.rotinas || {};
          const prelim = calcPrelim(sec.code, rot.q1_1, rot.q1_2, a.q1);
          return `<tr>
            <td>${a.nome}<span class="tag">${a.escalao} · ${a.sexo}</span></td>
            ${renderCell(rot.q1_1, hasPen1, cols1)}
            ${renderCell(rot.q1_2, hasPen2, cols2)}
            <td class="tot">${fmt(prelim)}</td>
          </tr>`;
        }).join('');

        return `<h2>${sec.label}</h2>
          <table>
            <thead>
              <tr>
                <th rowspan="2">Ginasta</th>
                <th colspan="${cols1}">Série 1</th>
                <th colspan="${cols2}">Série 2</th>
                <th rowspan="2">Total Prelim.</th>
              </tr>
              <tr>${head1}${head2}</tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }).join('');
    }

    async function refresh() {
      if (document.visibilityState === 'hidden') return;
      try {
        const t0 = performance.now();
        let aths = [];
        let sourceLabel = '';

        try {
          const doc = await fetchFastGitHubRaw();
          aths = doc.atletas || [];
          const ageSec = doc.atualizadoEm ? Math.round((Date.now() - new Date(doc.atualizadoEm).getTime()) / 1000) : 999;
          sourceLabel = `GitHub Live (${Math.round(performance.now() - t0)}ms · sync há ${ageSec}s)`;

          if (ageSec > 45) {
            const direct = await fetchDirectFromSporttech();
            if (direct.length) {
              aths = direct;
              sourceLabel = `Direto Sporttech (${Math.round(performance.now() - t0)}ms)`;
            }
          }
        } catch (_) {
          aths = await fetchDirectFromSporttech();
          sourceLabel = `Direto Sporttech (${Math.round(performance.now() - t0)}ms)`;
        }

        renderTables(aths);
        document.getElementById('meta').textContent =
          `${sourceLabel} · Atualizado: ${new Date().toLocaleTimeString('pt-PT')} · ${aths.length} ginastas POR`;
      } catch (e) {
        document.getElementById('meta').textContent = `Erro: ${e.message}`;
      }
    }

    refresh();
    setInterval(refresh, 10000);
    document.addEventListener('visibilitychange', refresh);
  </script>
